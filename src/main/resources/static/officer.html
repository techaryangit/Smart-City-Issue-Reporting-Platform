<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Officer – Smart City Issue Reporting</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top"><h1>🛠️ Field Officer Dashboard</h1>
  <div class="who"><span id="whoami"></span><button class="btn sec small" onclick="App.logout()">Logout</button></div></header>
<main>
  <div class="card"><h2>Complaints Assigned to Me</h2>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Location</th><th></th></tr></thead>
    <tbody id="body"></tbody></table></div>
    <p class="muted hidden" id="empty">No complaints are assigned to you yet.</p>
  </div>
</main>
<div class="modal-bg" id="modal" onclick="if(event.target===this)App.closeModal()"><div class="modal"></div></div>
<script src="/js/app.js"></script>
<script>
let list = [];
(async () => { if (await App.requireRole('OFFICER')) load(); })();
async function load() {
  list = await App.api('/api/officer/complaints');
  document.getElementById('empty').classList.toggle('hidden', list.length > 0);
  document.getElementById('body').innerHTML = list.map(c => `<tr><td>${App.esc(c.complaintCode)}</td><td>${App.esc(c.title)}</td><td>${App.label(c.category)}</td>
    <td>${App.pbadge(c.priority)}</td><td>${App.badge(c.status)}</td><td>${App.esc(c.address)}</td>
    <td><button class="btn small" onclick="open_(${c.id})">Open</button></td></tr>`).join('');
}
async function open_(id) {
  const base = list.find(x => x.id === id);
  const full = await App.api('/api/complaints/' + encodeURIComponent(base.complaintCode));
  App.openModal(App.detailHtml(full) + `
    <h3>Update progress</h3>
    <label for="stSel">Status</label><select id="stSel">${App.options(['IN_PROGRESS', 'RESOLVED'])}</select>
    <label for="stRem">Remark</label><textarea id="stRem" style="min-height:70px" maxlength="500" placeholder="Work done / notes"></textarea>
    <p><button class="btn" onclick="save(${id})">Save update</button> <button class="btn sec" onclick="App.closeModal()">Close</button></p>`);
}
async function save(id) {
  try {
    await App.api(`/api/officer/complaints/${id}/status`, { method: 'PUT', json: { status: document.getElementById('stSel').value, remark: document.getElementById('stRem').value } });
    App.toast('Status updated', 'ok'); App.closeModal(); load();
  } catch (e) { App.toast(e.message, 'err'); }
}
</script>
</body></html>
