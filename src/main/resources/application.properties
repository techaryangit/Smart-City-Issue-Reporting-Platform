spring.application.name=smart-city-issue-reporting
server.port=${PORT:8080}

# ---- MySQL (default) ----
spring.datasource.url=jdbc:mysql://localhost:3306/smartcity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- File upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# ---- Errors ----
server.error.include-message=always
server.error.include-binding-errors=never
